[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
# TruthMarketHook does not compile without IR (stack too deep in _afterSwap); Trueo built it with
# viaIR = true, optimizer 200 runs, cancun (Sourcify compilation settings).
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
ffi = false
fs_permissions = [{ access = "read", path = "./data" }, { access = "read-write", path = "./reports" }]

[lint]
lint_on_build = false

[fmt]
# Trueo's verified sources stay byte-identical (vendor/trueo.sha256)
ignore = ["src/trueo/**"]
